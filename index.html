<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fauji LLM, base vs fine-tuned</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 40px auto; max-width: 1100px; color: #1a1a1a; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #555; margin-top: 0; }
  textarea { width: 100%; box-sizing: border-box; padding: 12px; font-size: 15px; border: 1px solid #ccc;
             border-radius: 8px; resize: vertical; }
  button { margin-top: 10px; padding: 10px 22px; font-size: 15px; border: none; border-radius: 6px;
           background: #1a5c3f; color: white; cursor: pointer; }
  button:disabled { background: #999; cursor: default; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; margin-top: 24px; border: 1px solid #ddd;
             border-radius: 8px; overflow: hidden; }
  .col { padding: 16px 18px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; min-height: 60px; }
  .col.base { border-right: 1px solid #ddd; background: #fffdf7; }
  .col.finetuned { background: #f5fbf7; }
  .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
           color: #888; margin-bottom: 8px; }
  .status { margin-top: 10px; font-size: 13px; color: #777; }
</style>
</head>
<body>

<h1>IAF doctrine language model, side by side</h1>
<p class="sub">Type a question below, the same prompt is sent to both the base model and the fine-tuned model.</p>

<textarea id="prompt" rows="3">What is meant by force protection in a joint operations context?</textarea>
<br>
<button id="runBtn" onclick="runCompare()">Compare responses</button>
<div class="status" id="status"></div>

<div class="columns">
  <div class="col base">
    <div class="label">Base model</div>
    <div id="baseOut"></div>
  </div>
  <div class="col finetuned">
    <div class="label">Fine-tuned model</div>
    <div id="ftOut"></div>
  </div>
</div>

<script>
// Fill in the URL Cloudflare Tunnel gives you when you run it on the GPU
// server, e.g. https://fauji-llm.yourdomain.com or the trycloudflare.com URL
// for a quick tunnel. Must match FAUJI_LLM_API_KEY set on the GPU server.
const GPU_SERVER_URL = "https://tips-manitoba-printable-rid.trycloudflare.com/compare";
const API_KEY = "7k9P_m2xL$8vQW1zR#5bN0uY4tE9aC3iO7pK8wF2mS0vX5jZ1dH4gL6qT9yU3eI";

async function runCompare() {
  const prompt = document.getElementById('prompt').value.trim();
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const baseOut = document.getElementById('baseOut');
  const ftOut = document.getElementById('ftOut');

  if (!prompt) return;

  btn.disabled = true;
  status.textContent = "Querying both models, this can take 10 to 30 seconds...";
  baseOut.textContent = "";
  ftOut.textContent = "";

  try {
    const resp = await fetch(GPU_SERVER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY
      },
      body: JSON.stringify({ prompt })
    });
    const data = await resp.json();

    if (!resp.ok) {
      status.textContent = "Error: " + (data.detail || resp.statusText);
    } else {
      baseOut.textContent = data.base_output;
      ftOut.textContent = data.finetuned_output;
      status.textContent = "Done.";
    }
  } catch (err) {
    status.textContent = "Request failed: " + err;
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
